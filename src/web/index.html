<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; frame-src 'self' about: data: blob:; media-src 'self' data: blob:; connect-src 'self' https://pypi.org">
<meta name="theme-color" content="#07080c">
<meta name="description" content="Textline im Browser: Text- und Code-Editor mit Farben für über 140 Sprachen und Python – die Dateien bleiben in deinem Browser.">
<title>Textline</title>
<link rel="manifest" href="/text/app.webmanifest">
<link rel="icon" href="/app-icons/text-192.png">
<link rel="apple-touch-icon" href="/app-icons/text-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Textline">
<link rel="stylesheet" href="style.css">
</head>
<body class="web">
<div id="app">
  <header id="topbar">
    <nav id="menubar" class="menubar"></nav>
    <div id="classicbar" class="classicbar"></div>
    <div class="tabrow">
      <button id="main-menu" class="icon-btn menu-anchor" title="Menu"></button>
      <div id="tabs" class="tabs"></div>
      <button id="new-tab" class="icon-btn small" title="New"></button>
      <div class="spacer"></div>
      <div id="toolbar" class="toolbar"></div>
    </div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="workspace">
    <section id="editor-pane">
      <div id="editor"></div>
      <div id="welcome" class="welcome hidden"></div>
    </section>
    <div id="preview-split" class="splitter v hidden"></div>
    <section id="preview-pane" class="hidden">
      <div class="pane-head"><span id="preview-title">Preview</span><span class="spacer"></span><button id="preview-browser" class="icon-btn small"></button></div>
      <iframe id="preview" sandbox="allow-same-origin" title="Preview"></iframe>
    </section>
  </main>
  <div id="console-split" class="splitter h hidden"></div>
  <section id="console" class="hidden">
    <div class="pane-head"><span id="console-title">Console</span><span class="spacer"></span><button id="console-clear" class="icon-btn small"></button><button id="console-close" class="icon-btn small"></button></div>
    <div class="console-out" tabindex="-1"></div>
    <div class="console-inrow"><span class="console-prompt">&gt;&gt;&gt;</span><input id="console-input" class="console-input" spellcheck="false" autocomplete="off" autocapitalize="off"></div>
  </section>
  <footer id="statusbar"></footer>
</div>
<script src="app.js"></script>
</body>
</html>
